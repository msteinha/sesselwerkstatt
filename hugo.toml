theme = 'ananke'
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "Sesselwerkstatt"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Projekte"
    url = "/pages/gallery"
    weight = 2

  [[menu.main]]
    name = "Kontakt"
